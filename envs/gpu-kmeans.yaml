name: gpu-kmeans
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13

  # RAPIDS
  - rapids
  - cuml
  - cupy

  # Core
  - numpy
  - pandas
  - scikit-learn>=1.7

  # Utilities
  - pyprojroot
  - statannotations

  # Jupyter support
  - jupyterlab
  - notebook
  - ipykernel
  - nb_conda_kernels

  - pip
  - pyreadr
  - rpy2

runtime_benchmark_gtex:
  dataset: GTEx
  seeds: [123, 456, 789]
  threads: 4

  methods: [CLAMPfull, CLAMPbase, PLIER, Flashier, NMF, PCA, ICA, GSSig, MOFA-FLEX]

  excluded_methods:
    CoGAPS: >
      rule cogaps_gtex was run to the end of its hard wall-clock budget
      (gtex.cogaps.timeout_days = 7) and killed without converging; the evidence
      is on disk at output/01_model_building/01_gtex/CoGAPS/NOT_CONVERGED.txt.
      CoGAPS therefore has no finite GTEx runtime to report, and re-running it
      here would only re-derive the same censored value at a cost of 21 days.
      Reported as a right-censored ">7 days, did not converge", not as a data
      point.  Same reason it is absent from rule full_models_gtex.
  cogaps_evidence: output/01_model_building/01_gtex/CoGAPS/NOT_CONVERGED.txt

  output_root: output/02_model_performance/01_gtex/00_computational_timing
  notebook: nbs/02_model_performance/01_gtex/00_computational_timing.ipynb

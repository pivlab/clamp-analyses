methods:
  CLAMPbase: CLAMPbase/B.csv
  CLAMPfull: CLAMPfull/B.csv
  PLIER: PLIER/B.csv
  PCA: PCA/B.csv
  NMF: NMF/B.csv
  ICA: ICA/B.csv
  Flashier: flashier/B.csv
  MOFA-FLEX: MOFA_FLEX_PRIOR/B.csv
  GSSig: GSS/B.csv
  CoGAPS: CoGAPS/B.csv

paths:
  production: output/01_model_building/00_pseudobulk
  biology: output/03_model_biology/00_pseudobulk
  model_notebooks: nbs/01_model_building/00_pseudobulk
  biology_notebooks: nbs/03_model_biology/00_pseudobulk
  panels: output/99_panels
  panels_notebooks: nbs/99_panels

references:
  go_bp_url: https://maayanlab.cloud/Enrichr/geneSetLibrary?mode=text&libraryName=GO_Biological_Process_2025
  go_bp_file: output/01_model_building/00_pseudobulk/references/GO_Biological_Process_2025.gmt
  go_bp_sha256: 0fc02458765cfce6c9348dce9f7a9397c6caf7c09ba318f468135d7ac60342ee
  cell_marker_file: data/pathways/Cell_marker_Human.xlsx
  allen_brain_gmt_file: data/pathways/Allen_Brain_Atlas_10x_scRNA_2021.gmt
  # Canonical reference-atlas markers for all pseudobulk cell-type ORA and
  # hard-pair loading panels. Each dataset is matched to its corresponding
  # Azimuth atlas (PBMC, Motor Cortex, Heart, or Lung V2/HLCA).
  azimuth_file: data/pathways/Azimuth_2023.txt
  # Binary genes x tissue matrix, one of the evaluation collections the GO:BP
  # prior is tested against for orthogonality.
  gtex_tissues_pathmat: data/archs4/GTEx_Tissues_pathMat.rds
  brain_datasets: [Brain_Mathys2023, Brain_Xiong2023]

# Gene filter on linear pseudobulk CPM. CPM normalization happens once, upstream
# of preprocess.R; no log transform or second CPM normalization is applied here.
preprocess:
  mean_cutoff: 0.5
  var_cutoff: 0.1
  seed: 123
# CLAMPbase/CLAMPfull fit settings, shared by model building, the runtime
# benchmark and grouped-CV refits. max_iter is headroom above the iteration
# count CLAMP actually needs to reach its 5e-4 relative-change convergence
# tolerance; fits stop well before this cap in practice.
clamp:
  max_iter: 500
  seed: 123
grouped_cv:
  n_folds: 5
  group_col: sample
  split_seed: 42
  min_train_lv_cor: 0.5
  bootstrap_seed: 123
  bootstrap_replicates: 10000
# flashier: greedy factor addition followed by backfit_maxiter backfitting
# iterations to refine loadings. Set independently of the GTEx pipeline because
# the pipelines operate on different data scales and matrix sizes.
flashier:
  backfit_maxiter: 10
# CoGAPS Gibbs sampler settings, identical to the GTEx pipeline's cogaps
# block. n_iterations follows the package's own guidance for exploratory
# genome-wide-distributed runs; distributed=genome-wide (set in cogaps.R,
# not here) partitions genes into ~1,000-5,000-gene subsets so memory stays
# tractable at this rank.
cogaps:
  n_iterations: 5000
  n_threads: 4
  seed: 123
# MOFA-FLEX epoch budget under the Horseshoe weight prior. Set independently of
# the GTEx pipeline for the same reason as flashier above.
mofa_flex:
  max_epochs: 200
  seed: 123
projection:
  chunk_cells: 20000
  chunk_nnz: 20000000
  top_fraction: 0.01

archs4:
  raw_url: https://s3.dev.maayanlab.cloud/archs4/files/human_gene_v2.5.h5
  raw_h5: data/archs4/human_gene_v2.5.h5
  # Max transcript length per HGNC symbol, pulled once from Ensembl 107. The
  # preprocessing notebook fetched this with biomaRt behind a commented-out
  # cell because the compute node has no internet; it is a tracked input here.
  gene_lengths: data/archs4/gene_lengths.rds
  ensembl_version: 107

  paths:
    production: output/01_model_building/02_archs4
    biology: output/03_model_biology/02_archs4
    model_notebooks: nbs/01_model_building/02_archs4
    biology_notebooks: nbs/03_model_biology/02_archs4

  raw_data:
    # Block size for streaming /data/expression out of the HDF5 file. Kept at
    # 100 rather than config.R's CHUNK_SIZE: at least one block in ARCHS4 v2.5
    # cannot be read, and a small block keeps the damage from that fallback
    # (a near-zero dummy block) contained.
    block_size: 100
    n_cores: 10

  preprocess:
    mean_cutoff: 0.5
    var_cutoff: 0.1
    # Drop libraries ARCHS4 flags as probably single-cell.
    single_cell_probability_max: 0.5
    seed: 123

  svd:
    n_cores: 30
    seed: 123

  clamp:
    # CLAMP_K = num.pc(svd$d) * k_multiplier
    k_multiplier: 2
    # The values that actually produced the shipped model. config.R's
    # CLAMP_PARAMS (MAX_ITER 350, MULTICLAMP 3) belonged to the earlier
    # 04_archs4_CLAMPfull chain, which is superseded.
    multiplier: 100
    max_iter: 5000
    seed: 123

  # Prior used by the existing production ARCHS4 model.  The coverage-only BP
  # campaign below has its own prior and does not silently invalidate this
  # production rule.
  prior:
    gmts:
      REACTOME: data/pathways/c2.cp.reactome.v2026.1.Hs.symbols.gmt
      GOCC: data/pathways/c5.go.cc.v2026.1.Hs.symbols.gmt
      C8: data/pathways/c8.all.v2026.1.Hs.symbols.gmt

  coverage:
    prior_gmt: data/pathways/go_bp.Hs.symbols.gmt
    databases: [canonical, cellmarker]
    # Models and ORA sit beside the subsamples that produced them: everything
    # computational is under 01_model_building, while 03_model_biology keeps
    # only the report tables and the notebook.
    model_root: output/01_model_building/02_archs4/02_coverage_study/models
    ora_root: output/01_model_building/02_archs4/02_coverage_study/ora
    assignments: output/03_model_biology/02_archs4/00_coverage/assignments
    seeds: [1, 2, 3]
    rng_seeds: [123, 124, 125]
    levels:
      "1": 00_bp_coverage_study_01
      "5": 01_bp_coverage_study_05
      "10": 02_bp_coverage_study_10
      "25": 03_bp_coverage_study_25
      "50": 04_bp_coverage_study_50
      "75": 05_bp_coverage_study_75
      "100": 06_bp_coverage_study_100
    input_root: output/01_model_building/02_archs4/02_coverage_study
    model_name: CLAMPfull_bp
    resources:
      # runtime is in minutes, as expected by the Slurm executor plugin.
      #
      # The 50-100% requests are sized from measured peak RSS rather than from
      # the conservative first-pass estimates, so that more than one large fit
      # fits on a 900 GB node at once.  Observed peaks: 11.9 GB at 1%, 19.0 at
      # 5%, 28.0 at 10%, 54.6 at 25%, 223 at 100%; growth above 25% is roughly
      # 2.25 GB per percentage point, giving ~111 GB at 50% and ~167 GB at 75%.
      # Each request below is about 1.7x its predicted peak (1.4x at 100%,
      # where the peak is measured, not predicted), and the retry ladder still
      # adds 1.5x and 2x on failure.
      "1": {mem_mb: 32000, runtime: 5760}
      "5": {mem_mb: 64000, runtime: 8640}
      "10": {mem_mb: 96000, runtime: 14400}
      "25": {mem_mb: 224000, runtime: 24000}
      "50": {mem_mb: 192000, runtime: 36000}
      "75": {mem_mb: 288000, runtime: 48000}
      "100": {mem_mb: 320000, runtime: 54000}
    comparators:
      gtex:
        label: GTEx
        fbm_rds: output/01_model_building/01_gtex/gtex_fbm_filt.rds
        genes_rds: output/01_model_building/01_gtex/gtex_genes.rds
        samples_rds: output/01_model_building/01_gtex/gtex_samples.rds
        svd: output/01_model_building/01_gtex/gtex_svdRes.rds
        k: output/01_model_building/01_gtex/CLAMP_K_gtex.rds
        base: output/01_model_building/01_gtex/CLAMPbase.rds
        base_z: output/01_model_building/01_gtex/CLAMPbase/Z.csv
        max_iter: 500
      recount2:
        label: recount2
        fbm_rds: output/01_model_building/03_recount2/00_recount2/recount2_fbm_filt.rds
        genes_rds: output/01_model_building/03_recount2/00_recount2/recount2_genes.rds
        samples_rds: output/01_model_building/03_recount2/00_recount2/recount2_samples.rds
        svd: output/01_model_building/03_recount2/00_recount2/recount2_svdRes.rds
        k: output/01_model_building/03_recount2/00_recount2/CLAMP_K_recount2.rds
        base: output/01_model_building/03_recount2/00_recount2/CLAMPbase.rds
        base_z: output/01_model_building/03_recount2/00_recount2/CLAMPbase/Z.csv
        max_iter: 500
    colors:
      model:
        CLAMPfull: "#0072B2"
        CLAMPbase: "#777777"
      dataset:
        ARCHS4: "#0072B2"
        GTEx: "#E69F00"
        recount2: "#009E73"
    routing:
      remote_min_free_cpus: 2
      remote_min_free_mem_mb: 16000
      remote_max_ora_jobs: 8
      local_total_mem_mb: 96000
      retries: 2
      retry_mem_factors: [1.0, 1.5, 2.0]
      retry_mem_cap_mb: 800000
    bp_models_root: output/98_final_models/clampfull/bp
    bp_model_datasets: [archs4, gtex, recount2]
    clampbase_root: output/98_final_models/clampbase
    clampbase_seed: {archs4: 1, gtex: 0, recount2: 0}
    clampbase_source:
      archs4:
        model: output/98_final_models/clampbase/archs4/CLAMPbase.rds
        z: output/98_final_models/clampbase/archs4/Z.csv
        b: output/98_final_models/clampbase/archs4/B.csv
      gtex:
        model: output/01_model_building/01_gtex/CLAMPbase.rds
        z: output/01_model_building/01_gtex/CLAMPbase/Z.csv
        b: output/01_model_building/01_gtex/CLAMPbase/B.csv
      recount2:
        model: output/01_model_building/03_recount2/00_recount2/CLAMPbase.rds
        z: output/01_model_building/03_recount2/00_recount2/CLAMPbase/Z.csv
        b: output/01_model_building/03_recount2/00_recount2/CLAMPbase/B.csv

  # Saturation: pathway recovery against model rank K, at several study
  # subsampling levels.
  saturation:
    prior_gmt: data/pathways/go_bp.Hs.symbols.gmt
    model_root: output/01_model_building/02_archs4/01_saturation/models
    ora_root: output/01_model_building/02_archs4/01_saturation/ora
    seeds: [1, 2, 3]
    rng_seeds: [123, 124, 125]
    fractions: [1, 5, 10, 25, 50, 75]
    k_values: [86, 173, 432, 864, 1296, 1728]
    # Cells that cannot be fit, as [fraction, k, seed]: rs1/k1728/seed1's SVD
    # rank (1,527) is below the 1,728 components K requires.
    exclude_cells:
      - [1, 1728, 1]
    # Inputs come from the coverage cells, one per (fraction, seed), shared
    # across all six K values.
    input_root: output/01_model_building/02_archs4/02_coverage_study
    input_levels:
      "1": 00_bp_coverage_study_01
      "5": 01_bp_coverage_study_05
      "10": 02_bp_coverage_study_10
      "25": 03_bp_coverage_study_25
      "50": 04_bp_coverage_study_50
      "75": 05_bp_coverage_study_75
    input_leaf: study_coverage_rs{fraction}_seed_{seed}
    # CLAMPbase cells produced by the earlier sweep, reused as-is.
    base_root: output/01_model_building/02_archs4/01_saturation
    base_leaf: study_saturation_rs{fraction}_k{k}_seed_{seed}
    model_name: CLAMPfull_bp
    max_iter: 5000
    # Study-subsampled sample counts, read from each cell's run_info.rds.
    n_samples:
      "1": 6109
      "5": 30308
      "10": 60645
      "25": 152860
      "50": 303309
      "75": 454404
    # mem_mb/runtime per (fraction, K), from measured peak RSS and wall time.
    resources:
      "1":
        "86": {mem_mb: 24000, runtime: 360}
        "173": {mem_mb: 24000, runtime: 360}
        "432": {mem_mb: 24000, runtime: 420}
        "864": {mem_mb: 24000, runtime: 420}
        "1296": {mem_mb: 24000, runtime: 600}
        "1728": {mem_mb: 24000, runtime: 900}
      "5":
        "86": {mem_mb: 24000, runtime: 420}
        "173": {mem_mb: 24000, runtime: 420}
        "432": {mem_mb: 32000, runtime: 420}
        "864": {mem_mb: 32000, runtime: 480}
        "1296": {mem_mb: 32000, runtime: 480}
        "1728": {mem_mb: 32000, runtime: 540}
      "10":
        "86": {mem_mb: 32000, runtime: 420}
        "173": {mem_mb: 40000, runtime: 420}
        "432": {mem_mb: 40000, runtime: 480}
        "864": {mem_mb: 40000, runtime: 540}
        "1296": {mem_mb: 48000, runtime: 600}
        "1728": {mem_mb: 48000, runtime: 720}
      "25":
        "86": {mem_mb: 64000, runtime: 420}
        "173": {mem_mb: 64000, runtime: 480}
        "432": {mem_mb: 72000, runtime: 600}
        "864": {mem_mb: 80000, runtime: 780}
        "1296": {mem_mb: 88000, runtime: 960}
        "1728": {mem_mb: 96000, runtime: 1200}
      "50":
        "86": {mem_mb: 104000, runtime: 480}
        "173": {mem_mb: 112000, runtime: 540}
        "432": {mem_mb: 120000, runtime: 780}
        "864": {mem_mb: 144000, runtime: 1200}
        "1296": {mem_mb: 160000, runtime: 1560}
        "1728": {mem_mb: 184000, runtime: 1980}
      "75":
        "86": {mem_mb: 152000, runtime: 480}
        "173": {mem_mb: 160000, runtime: 600}
        "432": {mem_mb: 176000, runtime: 960}
        "864": {mem_mb: 200000, runtime: 1560}
        "1296": {mem_mb: 232000, runtime: 2160}
        "1728": {mem_mb: 264000, runtime: 2760}
    # Capped at 75% of the shared 168-CPU / 900 GB node.
    routing:
      total_mem_mb: 675000
      fit_slots: 10
      ora_slots: 24
      threads_per_fit: 8
      retries: 2
      retry_mem_factors: [1.0, 1.5, 2.0]
      retry_mem_cap_mb: 675000

  canonical:
    model_name: CLAMPfull_canonical
    final_root: output/98_final_models/clampfull/canonical
    compendia: [archs4, gtex, recount2]
    ora:
      databases: [bp, canonical, reactome, cellmarker]

  drug_diseases:
    data_dir: data/drug_disease_associations
    spredixcan_dir: data/phenomexcan/gene_assoc/spredixcan/pkl
    prior:
      c2_all: data/pathways/c2.all.v2026.1.Hs.symbols.gmt
      reactome: data/pathways/c2.cp.reactome.v2026.1.Hs.symbols.gmt
      cellmarker: data/pathways/Cell_marker_Human.xlsx
      sheet: human
      term_column: cell_name
      gene_column: Symbol
      output_gmt: output/01_model_building/02_archs4/03_drug_diseases_canonical/prior/canonical_reactome_cellmarker.gmt
    compute_root: output/01_model_building/02_archs4/03_drug_diseases_canonical
    report_root: output/03_model_biology/02_archs4/02_drug_diseases_canonical
    n_top_lvs: [5, 10, 25, 50]
    n_top_genes: [50, 100, 250, 500]
    figure_n_top_genes: 100
    figure_n_top_lvs: 10
    bootstrap:
      n_boot: 10000
      seed: 42

  # ORA collections. Coverage and saturation use canonical + CellMarker;
  # canonical-model evaluation additionally uses BP and Reactome.
  ora:
    databases:
      bp:
        type: gmt
        path: data/pathways/go_bp.Hs.symbols.gmt
        label: GO Biological Process
      reactome:
        type: gmt
        path: data/pathways/c2.cp.reactome.v2026.1.Hs.symbols.gmt
        label: Reactome
      canonical:
        type: gmt
        path: data/pathways/c2.cp.v2026.1.Hs.symbols.gmt
        exclude_term_regex: ^REACTOME_
        label: Canonical non-Reactome
      cellmarker:
        type: cellmarker_xlsx
        path: data/pathways/Cell_marker_Human.xlsx
        sheet: human
        term_column: cell_name
        gene_column: Symbol
        label: CellMarker
    top_pct: 0.01
    min_size: 10
    max_size: 500
    pvalue_cutoff: 0.05
    qvalue_cutoff: 0.2
    fdr: [0.05]
    # Measured across the 150 coverage ORAs: median 122 s, max 407 s at K = 1728.
    resources: {mem_mb: 8000, runtime: 60}


  # Published model contract. Root-level final-model files are legacy archives
  # and must never be referenced by active rules or analyses.
  final_models:
    clampbase:
      archs4: {root: output/98_final_models/clampbase/archs4, rds: CLAMPbase.rds, b: B.csv, z: Z.csv}
      gtex: {root: output/98_final_models/clampbase/gtex, rds: CLAMPbase.rds, b: B.csv, z: Z.csv}
      recount2: {root: output/98_final_models/clampbase/recount2, rds: CLAMPbase.rds, b: B.csv, z: Z.csv}
    clampfull:
      bp:
        archs4: {root: output/98_final_models/clampfull/bp/archs4/CLAMPfull_bp, rds: CLAMPfull_bp.rds, b: B.csv, z: Z.csv, summary: summary.csv}
        gtex: {root: output/98_final_models/clampfull/bp/gtex/CLAMPfull_bp, rds: CLAMPfull_bp.rds, b: B.csv, z: Z.csv, summary: summary.csv}
        recount2: {root: output/98_final_models/clampfull/bp/recount2/CLAMPfull_bp, rds: CLAMPfull_bp.rds, b: B.csv, z: Z.csv, summary: summary.csv}
      canonical:
        archs4: {root: output/98_final_models/clampfull/canonical/archs4, rds: CLAMPfull_canonical.rds, b: B.csv, z: Z.csv, summary: summary.csv, provenance: adoption_validation.json}
        gtex: {root: output/98_final_models/clampfull/canonical/gtex, rds: CLAMPfull_canonical.rds, b: B.csv, z: Z.csv, summary: summary.csv, provenance: adoption_validation.json}
        recount2: {root: output/98_final_models/clampfull/canonical/recount2, rds: CLAMPfull_canonical.rds, b: B.csv, z: Z.csv, summary: summary.csv, provenance: adoption_validation.json}
